<style>
  /* Layout: home page of topic tiles; each topic is a 20-card flashcard deck (English on the front, Irish revealed on Next). */
  :root {
    --bg: #f5f3ee;
    --card: #ffffff;
    --text: #1f2a24;

  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #14181a;
      --card: #1f2528;
      --text: #eef2ef;
      --muted: #9aa69f;
      --border: #313a3d;
      --accent: #3ccf8e;
      --accent-text: #4fd99b;
      --accent-press: #2fb87b;
      --on-accent: #08170f;
      --again: #ff9a5c;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #14181a;
    --card: #1f2528;
    --text: #eef2ef;
    --muted: #9aa69f;
    --border: #313a3d;
    --accent: #3ccf8e;
    --accent-text: #4fd99b;
    --accent-press: #2fb87b;
    --on-accent: #08170f;
    --again: #ff9a5c;
    color-scheme: dark;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-body);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding-block: 16px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  .app { width: 100%; max-width: 560px; display: flex; flex-direction: column; flex: 1; gap: 14px; min-width: 0; }
  header { display: flex; justify-content: space-between; align-items: center; gap: 12px; }

  .bar { height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; }
  .bar > div { height: 100%; width: 0; background: var(--accent); transition: width .25s ease; }
  .headleft { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .topics { padding: 8px 12px; font-size: 14px; border-radius: 10px; white-space: nowrap; }

  /* Home */
  .home-title { font-size: 26px; font-weight: 700; margin: 6px 0 0; }
  .home-sub { color: var(--muted); font-size: 15px; margin: 0; }
  .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
  .tile {
    display: flex; flex-direction: column; align-items: flex-start; justify-content: space-between; gap: 10px;
    min-height: 112px; padding: 16px; text-align: left;
    background: var(--card); border: 1px solid var(--border); border-radius: 18px; color: var(--text);
  }
  .tile .icon { font-size: 26px; line-height: 1; }
  .tile .name { font-size: 17px; font-weight: 650; overflow-wrap: anywhere; }
  .tile .meta { font-size: 13px; color: var(--muted); }
  .tile.completed { border-color: var(--accent); }
  .tile.completed .meta { color: var(--accent-text); font-weight: 600; }

  .card {
    flex: 1;
    min-height: 260px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 28px 22px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    gap: 22px;
    cursor: pointer;
    user-select: none;
    min-width: 0;
  }

  .en, .ga { font-size: clamp(26px, 7vw, 38px); font-weight: 650; line-height: 1.25; text-wrap: balance; overflow-wrap: anywhere; }
  .ga { color: var(--accent-text); }
  .answer { visibility: hidden; opacity: 0; transform: translateY(6px); transition: opacity .2s ease, transform .2s ease; }
  .answer.show { visibility: visible; opacity: 1; transform: none; }
  .hint { color: var(--muted); font-size: 14px; min-height: 1.3em; }

  .row { display: flex; gap: 10px; }
  button {

  .primary { flex: 1; background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 650; font-size: 18px; padding: 16px; }
  .primary:active { background: var(--accent-press); border-color: var(--accent-press); }

const $ = id => document.getElementById(id);
const els = {
  home: $('home'), study: $('study'), grid: $('grid'), homesub: $('homesub'),
  topics: $('topics'), topictitle: $('topictitle'),
  card: $('card'), front: $('front'), ga: $('ga'), answer: $('answer'),
  hint: $('hint'), next: $('next'), prev: $('prev'), again: $('again'),
  count: $('count'), bar: $('bar'), shuffle: $('shuffle'), restart: $('restart'),
  reset: $('resetprogress')
};

let CARDS = [], currentSection = null;
let deck = [], i = 0, revealed = false, finished = false;

/* ---------- Progress (saved in this browser) ---------- */
const PROGRESS_KEY = 'ifc-progress-v1';
function loadProgress() {
  try { return JSON.parse(localStorage.getItem(PROGRESS_KEY)) || {}; } catch (e) { return {}; }
}
function saveProgress(p) {
  try { localStorage.setItem(PROGRESS_KEY, JSON.stringify(p)); } catch (e) {}
}
function markComplete(id) {
  const p = loadProgress();
  const prev = p[id] || { rounds: 0 };
  p[id] = { completed: true, rounds: (prev.rounds || 0) + 1 };
  saveProgress(p);
}

/* ---------- Home page ---------- */
function renderHome() {
  const p = loadProgress();
  let doneCount = 0;
  els.grid.innerHTML = '';
  SECTIONS.forEach(s => {
    const done = !!(p[s.id] && p[s.id].completed);
    if (done) doneCount++;
    const b = document.createElement('button');
    b.className = 'tile' + (done ? ' completed' : '');
    b.setAttribute('aria-label', s.title + ', ' + s.cards.length + ' phrases' + (done ? ', completed' : ''));
    b.innerHTML = '<span class="icon" aria-hidden="true"></span><span class="name"></span><span class="meta"></span>';
    b.querySelector('.icon').textContent = s.icon;
    b.querySelector('.name').textContent = s.title;
    b.querySelector('.meta').textContent = done ? '✓ Completed' : s.cards.length + ' phrases';
    b.addEventListener('click', () => openSection(s.id));
    els.grid.appendChild(b);
  });
  els.homesub.textContent = doneCount
    ? doneCount + ' of ' + SECTIONS.length + ' topics completed.'
    : 'Choose a topic. Each has 20 phrases.';
}

function openSection(id) {
  currentSection = SECTIONS.find(s => s.id === id);
  CARDS = currentSection.cards;
  els.topictitle.textContent = currentSection.title;
  els.home.hidden = true;
  els.study.hidden = false;
  window.scrollTo(0, 0);
  buildDeck();
}

function goHome() {
  stopAudio();
  els.study.hidden = true;
  els.home.hidden = false;
  currentSection = null;
  renderHome();
  window.scrollTo(0, 0);
}

const memCache = new Map(); // fallback when IndexedDB is unavailable

try { const v = localStorage.getItem('voice'); if (v) audioEls.voice.value = v; } catch (e) {}
try { const a = localStorage.getItem('autoplay'); if (a !== null) audioEls.autoplay.checked = a === '1'; } catch (e) {}

function openDb() {
  return new Promise((resolve, reject) => {
    if (!('indexedDB' in window)) return reject(new Error('no indexedDB'));
    const req = indexedDB.open(DB_NAME, 1);
    req.onupgradeneeded = () => req.result.createObjectStore(STORE);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
let dbPromise = null;
const getDb = () => (dbPromise = dbPromise || openDb());

async function cacheGet(key) {
  if (memCache.has(key)) return memCache.get(key);
  try {
    const db = await getDb();
    return await new Promise((resolve, reject) => {
      const r = db.transaction(STORE).objectStore(STORE).get(key);
      r.onsuccess = () => resolve(r.result || null);
      r.onerror = () => reject(r.error);
    });
  } catch (e) { return null; }
}
async function cachePut(key, blob) {
  memCache.set(key, blob);
  try {
    const db = await getDb();
    await new Promise((resolve, reject) => {
      const tx = db.transaction(STORE, 'readwrite');
      tx.objectStore(STORE).put(blob, key);
      tx.oncomplete = resolve; tx.onerror = () => reject(tx.error);
    });
  } catch (e) { /* cache is best-effort */ }
}

function b64ToBlob(b64, type) {
  const bin = atob(b64), bytes = new Uint8Array(bin.length);
  for (let k = 0; k < bin.length; k++) bytes[k] = bin.charCodeAt(k);
  return new Blob([bytes], { type });
}

// Returns an audio Blob for the phrase, from cache if we have it, otherwise from abair.ie.
async function getClip(text, voice) {
  const key = voice + '|' + text;
  const cached = await cacheGet(key);
  if (cached) return cached;
  const url = ABAIR_URL + '?input=' + encodeURIComponent(text) + '&voice=' + encodeURIComponent(voice) + '&normalise=true';
  const res = await fetch(url);
  if (!res.ok) throw new Error('abair.ie returned ' + res.status);
  const data = await res.json();
  if (!data.audioContent) throw new Error('No audio in response');
  const blob = b64ToBlob(data.audioContent, 'audio/wav');
  await cachePut(key, blob);
  return blob;
}

async function playIrish() {
  if (finished || !CARDS.length) return;
  const text = CARDS[deck[i]][1], voice = audioEls.voice.value;
  const token = ++playToken;
  audioEls.msg.textContent = '';
  audioEls.listen.setAttribute('aria-busy', 'true');
  try {
    const blob = await getClip(text, voice);
    if (token !== playToken) return; // user moved on
    if (player) { player.pause(); }
    if (currentUrl) URL.revokeObjectURL(currentUrl);
    currentUrl = URL.createObjectURL(blob);
    player = new Audio(currentUrl);
    await player.play();
  } catch (e) {
    if (token === playToken) {
      audioEls.msg.textContent = (navigator.onLine === false)
        ? 'Offline, and this phrase is not saved yet.'
        : 'Could not load audio. Tap Listen to retry.';
    }
  } finally {
    if (token === playToken) audioEls.listen.removeAttribute('aria-busy');
  }
}

function stopAudio() { playToken++; if (player) player.pause(); audioEls.msg.textContent = ''; audioEls.listen.removeAttribute('aria-busy'); }

// Fetch every phrase in every topic once (a few at a time, politely) so the app works offline.
let downloading = false;
async function downloadAll() {
  if (downloading) return;
  downloading = true;
  const voice = audioEls.voice.value;
  const texts = [...new Set(SECTIONS.flatMap(s => s.cards.map(c => c[1])))];
  let done = 0, failed = 0, next = 0;
  audioEls.dlall.disabled = true;
  const worker = async () => {
    while (next < texts.length) {
      const t = texts[next++];
      try { await getClip(t, voice); } catch (e) { failed++; }
      done++;
      audioEls.dlstatus.textContent = 'Saving ' + done + ' / ' + texts.length + '…';
    }
  };
  await Promise.all([worker(), worker(), worker()]);
  audioEls.dlstatus.textContent = failed ? ('Saved ' + (texts.length - failed) + ', ' + failed + ' failed. Try again.') : 'All ' + texts.length + ' phrases saved for offline use.';
  audioEls.dlall.disabled = false;
  downloading = false;
}

audioEls.listen.addEventListener('click', e => { e.stopPropagation(); playIrish(); });
audioEls.voice.addEventListener('change', () => { try { localStorage.setItem('voice', audioEls.voice.value); } catch (e) {} audioEls.dlstatus.textContent = ''; });
audioEls.autoplay.addEventListener('change', () => { try { localStorage.setItem('autoplay', audioEls.autoplay.checked ? '1' : '0'); } catch (e) {} });
audioEls.dlall.addEventListener('click', downloadAll);

/* ---------- Flashcards for the open topic ---------- */
function buildDeck() {
  deck = CARDS.map((c, idx) => idx);
  if (els.shuffle.checked) {
    for (let k = deck.length - 1; k > 0; k--) {
      const j = Math.floor(Math.random() * (k + 1));
      [deck[k], deck[j]] = [deck[j], deck[k]];
    }
  }
  i = 0; revealed = false; finished = false;
  render();
}

function render() {
  if (finished) {
    els.front.innerHTML = '<div class="done">Topic complete!</div>';
    els.answer.classList.remove('show');
    els.answer.hidden = true;
    els.hint.textContent = 'You went through every phrase in ' + currentSection.title + '. Go around again, or choose another topic.';
    els.next.textContent = 'Start again';
    els.again.hidden = true;
    els.prev.disabled = false;
    els.count.textContent = deck.length + ' / ' + deck.length;
    els.bar.style.width = '100%';
    return;
  }
  els.answer.hidden = false;
  els.front.innerHTML = '<div class="label">English</div><div class="en" id="en"></div>';
  const card = CARDS[deck[i]];
  document.getElementById('en').textContent = card[0];
  els.ga.textContent = card[1];
  els.answer.classList.toggle('show', revealed);
  els.hint.textContent = revealed ? '' : 'Tap anywhere, or press Next, to reveal the Irish';
  els.next.textContent = revealed ? 'Next phrase' : 'Show Irish';
  els.again.hidden = !revealed;
  els.prev.disabled = i === 0;
  els.count.textContent = (i + 1) + ' / ' + deck.length;
  els.bar.style.width = (i / deck.length * 100) + '%';
}

function advance() {
  if (finished) { stopAudio(); buildDeck(); return; }
  if (!revealed) {
    revealed = true; render();
    if (audioEls.autoplay.checked) playIrish();
    return;
  }
  stopAudio();
  if (i < deck.length - 1) { i++; revealed = false; }
  else { finished = true; markComplete(currentSection.id); }
  render();
}

function back() {
  stopAudio();
  if (finished) { finished = false; i = deck.length - 1; revealed = false; render(); return; }
  if (i > 0) { i--; revealed = false; render(); }
}

function practiseAgain() {
  // Send this phrase to the end of the deck so it comes round again.
  stopAudio();
  const [c] = deck.splice(i, 1);
  deck.push(c);
  revealed = false;
  if (i >= deck.length) i = deck.length - 1;
  render();
}

els.next.addEventListener('click', advance);
els.prev.addEventListener('click', back);
els.again.addEventListener('click', practiseAgain);
els.card.addEventListener('click', () => { if (!revealed && !finished) advance(); });
els.shuffle.addEventListener('change', () => { stopAudio(); buildDeck(); });
els.restart.addEventListener('click', () => { stopAudio(); buildDeck(); });
els.topics.addEventListener('click', goHome);
els.reset.addEventListener('click', () => {
  if (confirm('Clear your completed topics on this device?')) { saveProgress({}); renderHome(); }
});
document.addEventListener('keydown', e => {
  if (els.study.hidden) return;
  const t = e.target;
  // Let focused buttons, the select and the checkbox handle their own Space/Enter.
  if (t && (t.tagName === 'BUTTON' || t.tagName === 'INPUT' || t.tagName === 'SELECT') && e.key !== 'ArrowRight' && e.key !== 'ArrowLeft') return;
  if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'Enter') { e.preventDefault(); advance(); }
  else if (e.key === 'ArrowLeft') { e.preventDefault(); back(); }
});

renderHome();

if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
</script>

</body></html>
