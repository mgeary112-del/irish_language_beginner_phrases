<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="apple-touch-icon.png"><meta name="theme-color" content="#0f7a4c"><meta name="robots" content="noindex,nofollow"></head><body>
<title>Irish Flashcards</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
  /* Layout: one centred card column, English on the front, Irish revealed on Next. */
  :root {
    --bg: #f5f3ee;
    --card: #ffffff;
    --text: #1f2a24;
    --muted: #5f6b64;
    --border: #e1ddd2;
    --accent: #0f7a4c;
    --accent-text: #0f7a4c;
    --accent-press: #0b6540;
    --on-accent: #ffffff;
    --again: #c2561a;
    --font-body: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #14181a;
      --card: #1f2528;
      --text: #eef2ef;
      --muted: #9aa69f;
      --border: #313a3d;
      --accent: #3ccf8e;
      --accent-text: #4fd99b;
      --accent-press: #2fb87b;
      --on-accent: #08170f;
      --again: #ff9a5c;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #14181a;
    --card: #1f2528;
    --text: #eef2ef;
    --muted: #9aa69f;
    --border: #313a3d;
    --accent: #3ccf8e;
    --accent-text: #4fd99b;
    --accent-press: #2fb87b;
    --on-accent: #08170f;
    --again: #ff9a5c;
    color-scheme: dark;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-body);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding-block: 16px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  .app { width: 100%; max-width: 560px; display: flex; flex-direction: column; flex: 1; gap: 14px; min-width: 0; }
  header { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  h1 { font-size: 18px; margin: 0; font-weight: 700; }
  .count { color: var(--muted); font-size: 15px; font-variant-numeric: tabular-nums; }
  .bar { height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; }
  .bar > div { height: 100%; width: 0; background: var(--accent); transition: width .25s ease; }

  .card {
    flex: 1;
    min-height: 260px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 28px 22px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    gap: 22px;
    cursor: pointer;
    user-select: none;
    min-width: 0;
  }
  .label { font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
  .en, .ga { font-size: clamp(26px, 7vw, 38px); font-weight: 650; line-height: 1.25; text-wrap: balance; overflow-wrap: anywhere; }
  .ga { color: var(--accent-text); }
  .answer { visibility: hidden; opacity: 0; transform: translateY(6px); transition: opacity .2s ease, transform .2s ease; }
  .answer.show { visibility: visible; opacity: 1; transform: none; }
  .hint { color: var(--muted); font-size: 14px; min-height: 1.3em; }

  .row { display: flex; gap: 10px; }
  button {
    font: inherit;
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--text);
    border-radius: 14px;
    padding: 14px 16px;
    font-size: 16px;
    cursor: pointer;
  }
  button:active { transform: scale(.98); }
  button:disabled { opacity: .4; cursor: default; }
  .primary { flex: 1; background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 650; font-size: 18px; padding: 16px; }
  .primary:active { background: var(--accent-press); border-color: var(--accent-press); }
  .again { color: var(--again); border-color: var(--again); background: transparent; }
  .tools { display: flex; justify-content: space-between; align-items: center; color: var(--muted); font-size: 14px; }
  label { display: flex; align-items: center; gap: 8px; cursor: pointer; }
  input[type=checkbox] { width: 18px; height: 18px; accent-color: var(--accent); }
  .linkbtn { border: none; background: none; color: var(--muted); padding: 4px 0; font-size: 14px; text-decoration: underline; }
  .done { font-size: 26px; font-weight: 650; }

  /* Audio controls */
  .listen { margin-top: 14px; display: inline-flex; align-items: center; gap: 8px; color: var(--accent-text); border-color: var(--accent); background: transparent; font-weight: 600; }
  .listen[aria-busy="true"] { opacity: .6; }
  .audio-msg { color: var(--again); font-size: 13px; min-height: 1.3em; margin-top: 8px; }
  .tools2 { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; color: var(--muted); font-size: 14px; }
  select { font: inherit; font-size: 14px; color: var(--text); background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 8px 10px; max-width: 100%; }
  .dlstatus { color: var(--muted); font-size: 13px; min-height: 1.3em; }

  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) {
    .bar > div, .answer { transition: none; }
  }
</style>

<div class="app">
  <header>
    <h1>Irish Flashcards</h1>
    <div class="count" id="count">1 / 100</div>
  </header>
  <div class="bar"><div id="bar"></div></div>

  <div class="card" id="card" role="button" tabindex="0" aria-label="Reveal the Irish phrase">
    <div id="front">
      <div class="label">English</div>
      <div class="en" id="en"></div>
    </div>
    <div class="answer" id="answer">
      <div class="label">Irish</div>
      <div class="ga" id="ga"></div>
      <button class="listen" id="listen" aria-label="Play Irish audio">&#9654; Listen</button>
      <div class="audio-msg" id="audiomsg" role="status"></div>
    </div>
    <div class="hint" id="hint">Tap anywhere, or press Next, to reveal the Irish</div>
  </div>

  <div class="row">
    <button id="prev" aria-label="Previous phrase">&larr; Back</button>
    <button class="again" id="again" hidden>Practise again</button>
    <button class="primary" id="next">Show Irish</button>
  </div>

  <div class="tools">
    <label for="shuffle"><input type="checkbox" id="shuffle"> Shuffle</label>
    <button class="linkbtn" id="restart">Restart</button>
  </div>

  <div class="tools2">
    <label for="autoplay"><input type="checkbox" id="autoplay" checked> Auto-play audio</label>
    <select id="voice" aria-label="Voice">
      <option value="ga_MU_cmg_piper">Munster (Kerry) – male</option>
      <option value="ga_MU_nnc_piper">Munster (Kerry) – female</option>
      <option value="ga_UL_anb_piper">Ulster (Donegal) – female</option>
      <option value="ga_UL_doc_piper">Ulster (Donegal) – male</option>
      <option value="ga_CO_snc_piper">Connacht (Connemara)</option>
    </select>
  </div>
  <div class="tools2">
    <button class="linkbtn" id="dlall">Download all audio for offline use</button>
    <span class="dlstatus" id="dlstatus"></span>
  </div>
</div>

<script>
const CARDS = [
["Hello.","Dia duit."],
["Hi, how are you?","Haigh, conas atá tú?"],
["Good morning.","Maidin mhaith."],
["Good afternoon.","Tráthnóna maith."],
["Good evening.","Tráthnóna maith."],
["Good night.","Oíche mhaith."],
["Goodbye.","Slán."],
["See you later.","Feicfidh mé thú níos déanaí."],
["See you tomorrow.","Feicfidh mé thú amárach."],
["Nice to meet you.","Tá áthas orm bualadh leat."],
["Please.","Le do thoil."],
["Thank you.","Go raibh maith agat."],
["You're welcome.","Tá fáilte romhat."],
["Excuse me.","Gabh mo leithscéal."],
["I'm sorry.","Tá brón orm."],
["My name is Michael.","Michael is ainm dom."],
["What's your name?","Cén t-ainm atá ort?"],
["I'm from Australia.","Is as an Astráil mé."],
["Where are you from?","Cá as thú?"],
["I live in Melbourne.","Táim i mo chónaí i Melbourne."],
["I'm 30 years old.","Táim 30 bliain d'aois."],
["I speak a little English.","Labhraím beagán Béarla."],
["I'm learning English.","Táim ag foghlaim an Bhéarla."],
["I work as a teacher.","Oibrím mar mhúinteoir."],
["I'm a student.","Is mac léinn mé."],
["Yes.","Sea."],
["No.","Ní hea."],
["Maybe.","B'fhéidir."],
["I don't understand.","Ní thuigim."],
["I understand.","Tuigim."],
["Can you repeat that, please?","An féidir leat é sin a rá arís, le do thoil?"],
["Can you speak more slowly?","An féidir leat labhairt níos moille?"],
["What does \"hello\" mean?","Cad is brí le \"hello\"?"],
["How do you say \"thank you\" in English?","Conas a deirtear \"thank you\" i mBéarla?"],
["How do you spell that?","Conas a litríonn tú é sin?"],
["Do you speak English?","An labhraíonn tú Béarla?"],
["I don't know.","Níl a fhios agam."],
["I think so.","Ceapaim go labhraím."],
["Can you help me?","An féidir leat cabhrú liom?"],
["Just a moment, please.","Nóiméad amháin, le do thoil."],
["What is this?","Cad é seo?"],
["Where is the bathroom?","Cá bhfuil an leithreas?"],
["What time is it?","Cén t-am é?"],
["How much is this?","Cé mhéad atá ar seo?"],
["Who is that?","Cé hé sin?"],
["Why?","Cén fáth?"],
["When does it open?","Cathain a osclaíonn sé?"],
["When does it close?","Cathain a dhúnann sé?"],
["How far is it?","Cé chomh fada is atá sé?"],
["How long does it take?","Cé chomh fada a thógann sé?"],
["Which one do you recommend?","Cén ceann a mholann tú?"],
["Is this seat taken?","An bhfuil an suíochán seo tógtha?"],
["Where is the train station?","Cá bhfuil an stáisiún traenach?"],
["Where is the bus stop?","Cá bhfuil an stad bus?"],
["Turn left.","Cas ar chlé."],
["Turn right.","Cas ar dheis."],
["Go straight ahead.","Téigh díreach ar aghaidh."],
["I'm lost.","Tá mé caillte."],
["Is it near here?","An bhfuil sé in aice anseo?"],
["One ticket to Melbourne, please.","Ticéad amháin go Melbourne, le do thoil."],
["How do I get to the hotel?","Conas a shroichim an t-óstán?"],
["Where is the airport?","Cá bhfuil an t-aerfort?"],
["I need a taxi.","Teastaíonn tacsaí uaim."],
["Stop here, please.","Stad anseo, le do thoil."],
["What's the next stop?","Cén chéad stad eile?"],
["A table for two, please.","Bord do bheirt, le do thoil."],
["Can I see the menu?","An féidir liom an roghchlár a fheiceáil?"],
["I'd like water, please.","Ba mhaith liom uisce, le do thoil."],
["I'd like the chicken, please.","Ba mhaith liom an sicín, le do thoil."],
["What do you recommend?","Cad a mholann tú?"],
["I'm vegetarian.","Is vegetarian mé."],
["I'm allergic to nuts.","Tá ailléirge agam do chnónna."],
["Can I have the bill, please?","An féidir liom an bille a fháil, le do thoil?"],
["It's delicious.","Tá sé an-bhlasta."],
["I'm hungry.","Tá ocras orm."],
["I'm thirsty.","Tá tart orm."],
["No sugar, please.","Gan siúcra, le do thoil."],
["Can I pay by card?","An féidir liom íoc le cárta?"],
["How much does this cost?","Cé mhéad atá ar seo?"],
["That's too expensive.","Tá sé sin ró-chostasach."],
["Do you have a smaller size?","An bhfuil méid níos lú agat?"],
["Do you have a larger size?","An bhfuil méid níos mó agat?"],
["I'm just looking.","Níl mé ach ag breathnú."],
["I'll take it.","Glacfaidh mé leis."],
["Can I try this on?","An féidir liom é seo a thriail?"],
["Where can I pay?","Cá háit ar féidir liom íoc?"],
["Help!","Cabhair!"],
["Call the police.","Cuir glaoch ar na póilíní."],
["Call an ambulance.","Cuir glaoch ar otharcharr."],
["I need a doctor.","Tá dochtúir uaim."],
["I don't feel well.","Níl mé go maith."],
["It hurts here.","Tá pian anseo."],
["I lost my wallet.","Chaill mé mo sparán."],
["I like it.","Is maith liom é."],
["I don't like it.","Ní maith liom é."],
["I'm tired.","Tá tuirse orm."],
["I'm happy to be here.","Tá áthas orm a bheith anseo."],
["What do you do for fun?","Cad a dhéanann tú le haghaidh spraoi?"],
["That's great!","Tá sé sin ar fheabhas!"],
["Have a nice day!","Bíodh lá deas agat!"]
];

const $ = id => document.getElementById(id);
const els = {
  card: $('card'), front: $('front'), ga: $('ga'), answer: $('answer'),
  hint: $('hint'), next: $('next'), prev: $('prev'), again: $('again'),
  count: $('count'), bar: $('bar'), shuffle: $('shuffle'), restart: $('restart')
};

let deck = [], i = 0, revealed = false, finished = false;

/* ---------- Irish audio via abair.ie, cached in IndexedDB ---------- */
const ABAIR_URL = 'https://synthesis.abair.ie/api/synthesise';
const DB_NAME = 'irish-flashcards-audio', STORE = 'clips';
const audioEls = { listen: $('listen'), msg: $('audiomsg'), voice: $('voice'), autoplay: $('autoplay'), dlall: $('dlall'), dlstatus: $('dlstatus') };

let player = null, currentUrl = null, playToken = 0;
const memCache = new Map(); // fallback when IndexedDB is unavailable

try { const v = localStorage.getItem('voice'); if (v) audioEls.voice.value = v; } catch (e) {}
try { const a = localStorage.getItem('autoplay'); if (a !== null) audioEls.autoplay.checked = a === '1'; } catch (e) {}

function openDb() {
  return new Promise((resolve, reject) => {
    if (!('indexedDB' in window)) return reject(new Error('no indexedDB'));
    const req = indexedDB.open(DB_NAME, 1);
    req.onupgradeneeded = () => req.result.createObjectStore(STORE);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
let dbPromise = null;
const getDb = () => (dbPromise = dbPromise || openDb());

async function cacheGet(key) {
  if (memCache.has(key)) return memCache.get(key);
  try {
    const db = await getDb();
    return await new Promise((resolve, reject) => {
      const r = db.transaction(STORE).objectStore(STORE).get(key);
      r.onsuccess = () => resolve(r.result || null);
      r.onerror = () => reject(r.error);
    });
  } catch (e) { return null; }
}
async function cachePut(key, blob) {
  memCache.set(key, blob);
  try {
    const db = await getDb();
    await new Promise((resolve, reject) => {
      const tx = db.transaction(STORE, 'readwrite');
      tx.objectStore(STORE).put(blob, key);
      tx.oncomplete = resolve; tx.onerror = () => reject(tx.error);
    });
  } catch (e) { /* cache is best-effort */ }
}

function b64ToBlob(b64, type) {
  const bin = atob(b64), bytes = new Uint8Array(bin.length);
  for (let k = 0; k < bin.length; k++) bytes[k] = bin.charCodeAt(k);
  return new Blob([bytes], { type });
}

// Returns an audio Blob for the phrase, from cache if we have it, otherwise from abair.ie.
async function getClip(text, voice) {
  const key = voice + '|' + text;
  const cached = await cacheGet(key);
  if (cached) return cached;
  const url = ABAIR_URL + '?input=' + encodeURIComponent(text) + '&voice=' + encodeURIComponent(voice) + '&normalise=true';
  const res = await fetch(url);
  if (!res.ok) throw new Error('abair.ie returned ' + res.status);
  const data = await res.json();
  if (!data.audioContent) throw new Error('No audio in response');
  const blob = b64ToBlob(data.audioContent, 'audio/wav');
  await cachePut(key, blob);
  return blob;
}

async function playIrish() {
  if (finished) return;
  const text = CARDS[deck[i]][1], voice = audioEls.voice.value;
  const token = ++playToken;
  audioEls.msg.textContent = '';
  audioEls.listen.setAttribute('aria-busy', 'true');
  try {
    const blob = await getClip(text, voice);
    if (token !== playToken) return; // user moved on
    if (player) { player.pause(); }
    if (currentUrl) URL.revokeObjectURL(currentUrl);
    currentUrl = URL.createObjectURL(blob);
    player = new Audio(currentUrl);
    await player.play();
  } catch (e) {
    if (token === playToken) {
      audioEls.msg.textContent = (navigator.onLine === false)
        ? 'Offline, and this phrase is not saved yet.'
        : 'Could not load audio. Tap Listen to retry.';
    }
  } finally {
    if (token === playToken) audioEls.listen.removeAttribute('aria-busy');
  }
}

function stopAudio() { playToken++; if (player) player.pause(); audioEls.msg.textContent = ''; audioEls.listen.removeAttribute('aria-busy'); }

// Fetch every phrase once (a few at a time, politely) so the deck works offline.
let downloading = false;
async function downloadAll() {
  if (downloading) return;
  downloading = true;
  const voice = audioEls.voice.value;
  const texts = [...new Set(CARDS.map(c => c[1]))];
  let done = 0, failed = 0, next = 0;
  audioEls.dlall.disabled = true;
  const worker = async () => {
    while (next < texts.length) {
      const t = texts[next++];
      try { await getClip(t, voice); } catch (e) { failed++; }
      done++;
      audioEls.dlstatus.textContent = 'Saving ' + done + ' / ' + texts.length + '…';
    }
  };
  await Promise.all([worker(), worker(), worker()]);
  audioEls.dlstatus.textContent = failed ? ('Saved ' + (texts.length - failed) + ', ' + failed + ' failed. Try again.') : 'All ' + texts.length + ' phrases saved for offline use.';
  audioEls.dlall.disabled = false;
  downloading = false;
}

audioEls.listen.addEventListener('click', e => { e.stopPropagation(); playIrish(); });
audioEls.voice.addEventListener('change', () => { try { localStorage.setItem('voice', audioEls.voice.value); } catch (e) {} audioEls.dlstatus.textContent = ''; });
audioEls.autoplay.addEventListener('change', () => { try { localStorage.setItem('autoplay', audioEls.autoplay.checked ? '1' : '0'); } catch (e) {} });
audioEls.dlall.addEventListener('click', downloadAll);

function buildDeck() {
  deck = CARDS.map((c, idx) => idx);
  if (els.shuffle.checked) {
    for (let k = deck.length - 1; k > 0; k--) {
      const j = Math.floor(Math.random() * (k + 1));
      [deck[k], deck[j]] = [deck[j], deck[k]];
    }
  }
  i = 0; revealed = false; finished = false;
  render();
}

function render() {
  if (finished) {
    els.front.innerHTML = '<div class="done">All done!</div>';
    els.answer.classList.remove('show');
    els.answer.hidden = true;
    els.hint.textContent = 'You went through every phrase. Start again to go around once more.';
    els.next.textContent = 'Start again';
    els.again.hidden = true;
    els.prev.disabled = false;
    els.count.textContent = deck.length + ' / ' + deck.length;
    els.bar.style.width = '100%';
    return;
  }
  els.answer.hidden = false;
  els.front.innerHTML = '<div class="label">English</div><div class="en" id="en"></div>';
  const card = CARDS[deck[i]];
  document.getElementById('en').textContent = card[0];
  els.ga.textContent = card[1];
  els.answer.classList.toggle('show', revealed);
  els.hint.textContent = revealed ? '' : 'Tap anywhere, or press Next, to reveal the Irish';
  els.next.textContent = revealed ? 'Next phrase' : 'Show Irish';
  els.again.hidden = !revealed;
  els.prev.disabled = i === 0;
  els.count.textContent = (i + 1) + ' / ' + deck.length;
  els.bar.style.width = (i / deck.length * 100) + '%';
}

function advance() {
  if (finished) { stopAudio(); buildDeck(); return; }
  if (!revealed) {
    revealed = true; render();
    if (audioEls.autoplay.checked) playIrish();
    return;
  }
  stopAudio();
  if (i < deck.length - 1) { i++; revealed = false; }
  else { finished = true; }
  render();
}

function back() {
  stopAudio();
  if (finished) { finished = false; i = deck.length - 1; revealed = false; render(); return; }
  if (i > 0) { i--; revealed = false; render(); }
}

function practiseAgain() {
  // Send this phrase to the end of the deck so it comes round again.
  stopAudio();
  const [c] = deck.splice(i, 1);
  deck.push(c);
  revealed = false;
  if (i >= deck.length) i = deck.length - 1;
  render();
}

els.next.addEventListener('click', advance);
els.prev.addEventListener('click', back);
els.again.addEventListener('click', practiseAgain);
els.card.addEventListener('click', () => { if (!revealed && !finished) advance(); });
els.shuffle.addEventListener('change', buildDeck);
els.restart.addEventListener('click', () => { stopAudio(); buildDeck(); });
document.addEventListener('keydown', e => {
  const t = e.target;
  // Let focused buttons and the checkbox handle their own Space/Enter.
  if (t && (t.tagName === 'BUTTON' || t.tagName === 'INPUT') && e.key !== 'ArrowRight' && e.key !== 'ArrowLeft') return;
  if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'Enter') { e.preventDefault(); advance(); }
  else if (e.key === 'ArrowLeft') { e.preventDefault(); back(); }
});

buildDeck();

if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
</script>

</body></html>
